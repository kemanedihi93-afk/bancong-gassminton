<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendaftaran Anggota - BANCONG GASSMINTON</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101820, #253746);
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 26px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px #0005;
    }

    .logo {
      text-align: center;
      font-size: 48px;
    }

    h1 {
      color: #087f5b;
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      color: #263238;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 9px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #pesan {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #pesan.sukses {
      display: block;
      background: #d8f3dc;
      color: #1b4332;
    }

    #pesan.gagal {
      display: block;
      background: #ffe0e0;
      color: #9b2226;
    }

    .kembali {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #087f5b;
      font-weight: bold;
    }

    .catatan {
      margin-top: 18px;
      font-size: 12px;
      line-height: 1.5;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">🏸</div>

    <h1>Pendaftaran Anggota</h1>

    <p class="subtitle">
      <strong>BANCONG GASSMINTON</strong><br>
      DATAR BANCONG<br>
      Isi data dengan benar untuk mendaftar.
    </p>

    <form id="formDaftar">
      <label for="nama">Nama lengkap</label>
      <input
        id="nama"
        type="text"
        maxlength="100"
        autocomplete="name"
        placeholder="Masukkan nama lengkap"
        required
      >

      <label for="whatsapp">Nomor WhatsApp</label>
      <input
        id="whatsapp"
        type="tel"
        maxlength="20"
        inputmode="tel"
        autocomplete="tel"
        placeholder="Contoh: 081234567890"
        required
      >

      <label for="dusun">Pilih dusun</label>
      <select id="dusun" required>
        <option value="">-- Pilih dusun --</option>
        <option value="Dusun I">Dusun I</option>
        <option value="Dusun II">Dusun II</option>
        <option value="Dusun III">Dusun III</option>
        <option value="Dusun IV">Dusun IV</option>
        <option value="Dusun V">Dusun V</option>
      </select>

      <button id="tombolDaftar" type="submit">
        DAFTAR SEKARANG
      </button>
    </form>

    <div id="pesan" role="status" aria-live="polite"></div>

    <p class="catatan">
      Pendaftaran akan diperiksa oleh admin.
      Data belum menjadi keanggotaan aktif sebelum disetujui.
    </p>

    <div class="kembali">
      <a href="index.html">Kembali ke halaman utama</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://vyrypjxuhiywvkeiewpd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby";

    const form = document.getElementById("formDaftar");
    const tombol = document.getElementById("tombolDaftar");
    const pesan = document.getElementById("pesan");

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function tampilkanPesan(teks, jenis) {
      pesan.textContent = teks;
      pesan.className = jenis;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const nama = document.getElementById("nama").value.trim();
      const whatsapp = document.getElementById("whatsapp").value.trim();
      const dusun = document.getElementById("dusun").value;

      const digitWhatsapp = whatsapp.replace(/\D/g, "");

      if (nama.length < 2 || nama.length > 100) {
        tampilkanPesan(
          "Nama harus terdiri dari 2 sampai 100 karakter.",
          "gagal"
        );
        return;
      }

      if (
        digitWhatsapp.length < 8 ||
        digitWhatsapp.length > 15 ||
        !/^[0-9+\-()\s]+$/.test(whatsapp)
      ) {
        tampilkanPesan(
          "Nomor WhatsApp tidak valid. Periksa kembali nomor kamu.",
          "gagal"
        );
        return;
      }

      const daftarDusun = [
        "Dusun I",
        "Dusun II",
        "Dusun III",
        "Dusun IV",
        "Dusun V"
      ];

      if (!daftarDusun.includes(dusun)) {
        tampilkanPesan("Silakan pilih dusun terlebih dahulu.", "gagal");
        return;
      }

      tombol.disabled = true;
      tombol.textContent = "Mengirim pendaftaran...";
      pesan.className = "";
      pesan.textContent = "";

      try {
        const { error } = await db
          .from("member_registrations")
          .insert([{
            nama: nama,
            nomor_whatsapp: whatsapp,
            dusun: dusun,
            status: "pending"
          }]);

        if (error) {
          throw error;
        }

        tampilkanPesan(
          "Pendaftaran berhasil dikirim!\n\nDusun: " + dusun +
          "\nStatus: MENUNGGU PERSETUJUAN ADMIN.\n\nTerima kasih telah mendaftar!",
          "sukses"
        );

        form.reset();

      } catch (error) {
        console.error("Kesalahan pendaftaran:", error);

        let detail = error.message || "Kesalahan tidak diketahui";

        if (error.code === "42501") {
          detail = "Akses ditolak oleh Supabase. Periksa izin INSERT dan kebijakan RLS.";
        } else if (error.code === "42P01") {
          detail = "Tabel member_registrations tidak ditemukan.";
        } else if (error.code === "23514") {
          detail = "Ada data yang tidak sesuai dengan aturan tabel Supabase.";
        }

        tampilkanPesan(
          "PENDAFTARAN GAGAL\n\nPenyebab: " + detail +
          (error.code ? "\nKode: " + error.code : ""),
          "gagal"
        );

      } finally {
        tombol.disabled = false;
        tombol.textContent = "DAFTAR SEKARANG";
      }
    });
  </script>
</body>
</html>
