<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Anggota | BANCONG GASSMINTON</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101418;
      color: #f4f4f4;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      background: linear-gradient(135deg, #171717, #292929);
      border-bottom: 3px solid #e53935;
    }

    header h1 {
      margin: 0 0 8px;
      color: #ff4545;
      font-size: 25px;
    }

    header p {
      margin: 0;
      color: #ddd;
      font-size: 14px;
    }

    main {
      width: min(900px, 94%);
      margin: 24px auto;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    input, button, a {
      font: inherit;
      border-radius: 8px;
    }

    input {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      border: 1px solid #444;
      background: #1c2228;
      color: white;
    }

    button, .back {
      display: inline-block;
      padding: 12px 16px;
      border: 0;
      background: #e53935;
      color: white;
      text-decoration: none;
      cursor: pointer;
    }

    .back {
      background: #303840;
    }

    .info {
      margin-bottom: 16px;
      color: #bbb;
      font-size: 14px;
    }

    .member {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      padding: 15px;
      border: 1px solid #303840;
      border-radius: 10px;
      background: #1a2026;
    }

    .member-name {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .dusun {
      flex-shrink: 0;
      padding: 6px 10px;
      border-radius: 20px;
      background: #382122;
      color: #ff7777;
      font-size: 12px;
    }

    .message {
      padding: 20px;
      text-align: center;
      color: #ccc;
      background: #1a2026;
      border-radius: 10px;
    }

    footer {
      padding: 20px;
      text-align: center;
      color: #888;
      font-size: 12px;
    }
  </style></head><body>
  <header>
    <h1>🏸 BANCONG GASSMINTON</h1>
    <p>Daftar Anggota</p>
  </header>  <main>
    <div class="toolbar">
      <a class="back" href="index.html">← Kembali</a>
      <input
        id="search"
        type="search"
        placeholder="Cari nama atau dusun..."
        aria-label="Cari nama atau dusun"
      >
      <button id="refresh" type="button">Muat Ulang</button>
    </div><div id="info" class="info">Memeriksa akun...</div>
<div id="list" class="message">Memuat daftar anggota...</div>

  </main>  <footer>
    BANCONG GASSMINTON · Kebersamaan dan sportivitas
  </footer>  <script>
    const SUPABASE_URL = "https://vyrypjxuhiywvkeiewpd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const info = document.getElementById("info");
    const list = document.getElementById("list");
    const search = document.getElementById("search");

    let anggota = [];

    async function periksaAkun() {
      const { data, error } = await db.auth.getUser();

      if (error || !data.user) {
        window.location.replace("anggota-login.html");
        return;
      }

      await muatAnggota();
    }

    async function muatAnggota() {
      list.textContent = "Memuat daftar anggota...";
      info.textContent = "";

      const { data, error } = await db
        .from("members")
        .select("id, nama_anggota, dusun")
        .order("nama_anggota", { ascending: true });

      if (error) {
        console.error("Gagal memuat anggota:", error);
        info.textContent = "Daftar anggota belum dapat dimuat.";
        list.textContent =
          "Terjadi kendala saat mengambil data. Pastikan akun sudah disetujui dan akses database sudah benar.";
        return;
      }

      anggota = data || [];
      tampilkanAnggota();
    }

    function tampilkanAnggota() {
      const kata = search.value.trim().toLowerCase();

      const hasil = anggota.filter((item) => {
        const nama = String(item.nama_anggota || "").toLowerCase();
        const dusun = String(item.dusun || "").toLowerCase();

        return nama.includes(kata) || dusun.includes(kata);
      });

      info.textContent = `Total anggota ditampilkan: ${hasil.length}`;

      list.replaceChildren();

      if (hasil.length === 0) {
        list.className = "message";
        list.textContent = "Anggota tidak ditemukan.";
        return;
      }

      list.className = "";

      hasil.forEach((item) => {
        const baris = document.createElement("div");
        baris.className = "member";

        const nama = document.createElement("span");
        nama.className = "member-name";
        nama.textContent = item.nama_anggota || "Nama belum diisi";

        const dusun = document.createElement("span");
        dusun.className = "dusun";
        dusun.textContent = item.dusun
          ? `Dusun ${item.dusun}`
          : "Dusun belum diisi";

        baris.append(nama, dusun);
        list.appendChild(baris);
      });
    }

    search.addEventListener("input", tampilkanAnggota);
    document.getElementById("refresh").addEventListener("click", muatAnggota);

    periksaAkun();
  </script></body>
</html>
