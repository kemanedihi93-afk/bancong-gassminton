<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendaftaran Anggota - BANCONG GASSMINTON</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101820, #253746);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 26px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px #0005;
    }

    h1 {
      color: #087f5b;
      text-align: center;
      font-size: 25px;
    }

    .subtitle {
      color: #666;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 9px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #pesan {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #pesan.sukses {
      display: block;
      background: #d8f3dc;
      color: #1b4332;
    }

    #pesan.gagal {
      display: block;
      background: #ffe0e0;
      color: #9b2226;
    }

    .kembali {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #087f5b;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>🏸 Daftar Anggota</h1>

    <p class="subtitle">
      <strong>BANCONG GASSMINTON</strong><br>
      DATAR BANCONG<br>
      Isi nama dan nomor WhatsApp untuk mendaftar.
    </p>

    <form id="formDaftar">
      <label for="nama">Nama lengkap</label>
      <input
        id="nama"
        type="text"
        maxlength="100"
        placeholder="Masukkan nama lengkap"
        autocomplete="name"
        required
      >

      <label for="whatsapp">Nomor WhatsApp</label>
      <input
        id="whatsapp"
        type="tel"
        maxlength="20"
        inputmode="tel"
        placeholder="Contoh: 081234567890"
        autocomplete="tel"
        required
      >
