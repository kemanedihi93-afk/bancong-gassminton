<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Anggota - BANCONG GASSMINTON</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101820, #253746);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px #0005;
    }

    h1 {
      text-align: center;
      color: #087f5b;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 9px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #pesan {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #pesan.sukses {
      display: block;
      background: #d8f3dc;
      color: #1b4332;
    }

    #pesan.gagal {
      display: block;
      background: #ffe0e0;
      color: #9b2226;
    }

    .kembali {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    a {
      color: #087f5b;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>🏸 Daftar Anggota</h1>

    <p class="subtitle">
      BANCONG GASSMINTON<br>
      DATAR BANCONG<br>
      <small>Isi data dengan benar untuk mendaftar.</small>
    </p>

    <form id="formDaftar">
      <label for="nama">Nama lengkap</label>
      <input
        id="nama"
        type="text"
        maxlength="100"
        autocomplete="name"
        placeholder="Masukkan nama lengkap"
        required
      >

      <label for="whatsapp">Nomor WhatsApp</label>
      <input
        id="whatsapp"
        type="tel"
        maxlength="20"
        inputmode="tel"
        autocomplete="tel"
        placeholder="Contoh: 081234567890"
        required
      >

      <button id="tombolDaftar" type="submit">
        DAFTAR SEKARANG
      </button>
    </form>

    <div id="pesan" role="status" aria-live="polite"></div>

    <div class="kembali">
      <a href="index.html">Kembali ke halaman utama</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://vyrypjxuhiywvkeiewpd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("formDaftar");
    const tombol = document.getElementById("tombolDaftar");
    const pesan = document.getElementById("pesan");

    function tampilkanPesan(teks, jenis) {
      pesan.textContent = teks;
      pesan.className = jenis;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const nama = document.getElementById("nama")
        .value.trim();

      const whatsapp = document.getElementById("whatsapp")
        .value.trim();

      if (nama.length < 2 || nama.length > 100) {
        tampilkanPesan(
          "Nama harus terdiri dari 2 sampai 100 karakter.",
          "gagal"
        );
        return;
      }

      const digitWhatsapp = whatsapp.replace(/\D/g, "");

      if (
        digitWhatsapp.length < 8 ||
        digitWhatsapp.length > 15 ||
        !/^[0-9+()\-\s]+$/.test(whatsapp)
      ) {
        tampilkanPesan(
          "Periksa kembali nomor WhatsApp yang kamu masukkan.",
          "gagal"
        );
        return;
      }

      tombol.disabled = true;
      tombol.textContent = "Mengirim pendaftaran...";
      pesan.className = "";

      try {
        const { error } = await db
          .from("member_registrations")
          .insert({
            nama: nama,
            nomor_whatsapp: whatsapp,
            status: "pending"
          });

        if (error) {
          throw error;
        }

        tampilkanPesan(
          "Pendaftaran berhasil dikirim! Status kamu MENUNGGU PERSETUJUAN ADMIN. Data anggota belum aktif sampai admin menyetujuinya.",
          "sukses"
        );

        form.reset();

      } catch (error) {
        console.error("Kesalahan pendaftaran:", error);

        tampilkanPesan(
          "Pendaftaran belum berhasil disimpan. Silakan coba lagi nanti.",
          "gagal"
        );
      } finally {
        tombol.disabled = false;
        tombol.textContent = "DAFTAR SEKARANG";
      }
    });
  </script>
</body>
</html>
