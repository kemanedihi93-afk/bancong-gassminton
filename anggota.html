<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Login Anggota | Bancong Gassminton</title>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top, #461018, transparent 45%),
        #090909;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 30px 24px;
      border: 1px solid #383838;
      border-top: 5px solid #ed1024;
      border-radius: 20px;
      background: #151515;
      box-shadow: 0 15px 40px #0008;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
      line-height: 1.4;
    }

    .subtitle {
      margin: 8px 0 28px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 13px;
      border: 1px solid #484848;
      border-radius: 10px;
      background: #242424;
      color: #fff;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #ed1024;
      border-color: transparent;
    }

    button,
    .link-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #ed1024;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      margin-top: 12px;
      border: 1px solid #555;
      background: #222;
    }

    #pesan {
      margin: 18px 0 0;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .forgot {
      display: block;
      margin-top: 16px;
      color: #ff7b87;
      text-align: right;
      font-size: 13px;
      text-decoration: none;
    }

    .note {
      margin-top: 22px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }
  </style></head><body>
  <main class="card">
    <div class="logo">🏸</div><h1>BANCONG GASSMINTON</h1>
<p class="subtitle">LOGIN ANGGOTA & ADMIN</p>

<form id="formLogin">
  <label for="email">Email</label>
  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="Masukkan email"
    required
  >

  <label for="password">Kata sandi</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Masukkan kata sandi"
    required
  >

  <button id="tombolLogin" type="submit">
    MASUK MINAHI
  </button>
</form>

<a class="forgot" href="lupa-password.html">
  Lupa kata sandi?
</a>

<p id="pesan" role="status" aria-live="polite"></p>

<a href="index.html" class="link-button secondary">
  ← Kembali ke halaman utama
</a>

<p class="note">
  Gunakan akun yang sudah terdaftar di Bancong Gassminton.
</p>

  </main>  <script>
    const SUPABASE_URL =
      "https://vyrypjxuhiywvkeiewpd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby";

    const form = document.getElementById("formLogin");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const tombol = document.getElementById("tombolLogin");
    const pesan = document.getElementById("pesan");

    let db = null;

    function tampilkanPesan(teks, warna = "#fff") {
      pesan.textContent = teks;
      pesan.style.color = warna;
    }

    function buatClient() {
      if (!window.supabase || !window.supabase.createClient) {
        throw new Error(
          "Layanan login belum termuat. Periksa koneksi internet."
        );
      }

      if (!db) {
        db = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );
      }

      return db;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      tombol.disabled = true;
      tombol.textContent = "DIHI CEK KUDAI...";
      tampilkanPesan("Sedang memeriksa akun...", "#ffd166");

      try {
        const client = buatClient();
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error("Akun tidak ditemukan.");
        }

        const user = data.user;
        const role = user.app_metadata?.role;

        tampilkanPesan(
          "Login berhasil. Mengarahkan ke halaman...",
          "#42d392"
        );

        if (role === "admin") {
          window.location.replace("dashboard.html");
        } else {
          window.location.replace("index.html");
        }

      } catch (error) {
        console.error("Login gagal:", error);

        let pesanError = error.message || "Login gagal.";

        if (
          pesanError.toLowerCase().includes("invalid login credentials")
        ) {
          pesanError =
            "Email atau kata sandi salah. Periksa kembali, lalu coba lagi.";
        }

        tampilkanPesan(pesanError, "#ff6675");

        tombol.disabled = false;
        tombol.textContent = "MASUK KUDAI";
      }
    });
  </script></body>
</html>
