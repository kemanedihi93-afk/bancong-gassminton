<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Bancong Gassminton</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 25px;
      border-radius: 16px;
      background: #1d2935;
    }

    h1 {
      color: #ff4545;
      text-align: center;
      font-size: 24px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.5;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      background: #101820;
      color: white;
      border: 1px solid #465463;
    }

    button {
      background: #e83232;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    a { color: #ff7777; }

    #message {
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 14px;
    }

    .center { text-align: center; }
  </style>
</head>

<body>
  <main class="card">
    <h1>🏸 BANCONG GASSMINTON</h1>
    <p class="center">LOGIN ANGGOTA DATAR BANCONG</p>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Alamat email"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Kata sandi"
        autocomplete="current-password"
        required
      >

      <p style="text-align:right">
        <a href="lupa-password.html">Lupa Password?</a>
      </p>

      <button id="loginButton" type="submit">Masuk</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="center">
      <a href="index.html">← Kembali ke Beranda</a>
    </p>
  </main>

  <script>
    (() => {
      const SUPABASE_URL =
        'https://vyrypjxuhiywvkeiewpd.supabase.co';

      const SUPABASE_KEY =
        'sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby';

      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const button = document.getElementById('loginButton');
      const message = document.getElementById('message');

      const showMessage = (text, color = '#ff7777') => {
        message.textContent = text;
        message.style.color = color;
      };

      if (!window.supabase) {
        showMessage(
          'Layanan login gagal dimuat. Periksa internet dan muat ulang halaman.'
        );
        button.disabled = true;
        return;
      }

      const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        if (button.disabled) return;

        button.disabled = true;
        button.textContent = 'Memeriksa...';

        showMessage('Sedang memeriksa akun...', '#facc15');

        try {
          const { data, error } = await db.auth.signInWithPassword({
            email: emailInput.value.trim(),
            password: passwordInput.value
          });

          if (error) throw error;

          if (!data.user) {
            throw new Error('Informasi akun tidak ditemukan.');
          }

          const role = data.user.app_metadata?.role;

          showMessage(
            'Login berhasil. Mengarahkan ke halaman akun...',
            '#86efac'
          );

          if (role === 'admin') {
            window.location.replace('dashboard.html');
          } else {
            window.location.replace('anggota.html');
          }

        } catch (error) {
          console.error('Login gagal:', error);

          showMessage(
            'Login gagal: ' +
            (error.message || 'Kesalahan tidak diketahui.')
          );

          button.disabled = false;
          button.textContent = 'Masuk';
        }
      });
    })();
  </script>
</body>
</html>
