<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Anggota | Bancong Gassminton</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;background:#101820;
  color:#fff;font-family:Arial,sans-serif
}
.card{
  width:100%;max-width:400px;background:#1d2935;
  padding:25px;border-radius:16px
}
h1{color:#ff4545;text-align:center;font-size:25px}
p{text-align:center;color:#cbd5e1;line-height:1.5}
input,button{
  width:100%;padding:13px;margin-top:12px;
  border-radius:8px;font-size:16px
}
input{background:#101820;color:#fff;border:1px solid #465463}
button{
  background:#e83232;color:white;border:0;
  font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6;cursor:wait}
a{color:#ff7777}
.forgot{text-align:right;font-size:14px;margin-top:12px}
#message{
  font-size:14px;overflow-wrap:anywhere;
  text-align:left;white-space:pre-wrap
}
</style>
</head>

<body>
<div class="card">
  <h1>🏸 BANCONG GASSMINTON</h1>
  <p>LOGIN ANGGOTA DATAR BANCONG</p>

  <form id="loginForm">
    <input
      id="email"
      type="email"
      placeholder="Alamat email"
      autocomplete="username"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Kata sandi"
      autocomplete="current-password"
      required
    >

    <div class="forgot">
      <a href="lupa-password.html">Lupa Password?</a>
    </div>

    <button id="loginButton" type="submit">Masuk</button>
  </form>

  <p id="message" role="status" aria-live="polite"></p>
  <p><a href="index.html">← Kembali ke Beranda</a></p>
</div>

<script>
(function(){
  const SUPABASE_URL =
    'https://vyrypjxuhiywvkeiewpd.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby';

  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const button = document.getElementById('loginButton');
  const message = document.getElementById('message');

  function showMessage(text, color){
    message.textContent = text;
    message.style.color = color;
  }

  if (!window.supabase) {
    showMessage(
      'Layanan login gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.',
      '#ff7777'
    );
    button.disabled = true;
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  form.addEventListener('submit', async function(event){
    event.preventDefault();

    if (button.disabled) return;

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    button.disabled = true;
    button.textContent = 'Memeriksa...';
    showMessage('Sedang memeriksa akun...', '#facc15');

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        console.error('Login gagal:', error);
        showMessage(
          'Login gagal: ' + error.message,
          '#ff7777'
        );
        return;
      }

      if (!data.user) {
        showMessage(
          'Login belum berhasil. Akun pengguna tidak ditemukan.',
          '#ff7777'
        );
        return;
      }

      showMessage('Login berhasil. Membuka halaman...', '#86efac');

      const role = data.user.app_metadata?.role;

      setTimeout(function(){
        if (role === 'admin') {
          window.location.assign('dashboard.html');
        } else {
          window.location.assign('anggota.html');
        }
      }, 500);

    } catch (error) {
      console.error('Kesalahan login:', error);
      showMessage(
        'Terjadi kesalahan: ' +
        (error.message || 'Periksa koneksi internet dan coba lagi.'),
        '#ff7777'
      );
    } finally {
      button.disabled = false;
      button.textContent = 'Masuk';
    }
  });
})();
</script>
</body>
</html>
