<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persetujuan Anggota - Bancong Gassminton</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    h1 { color: #166534; }

    .card {
      background: white;
      padding: 18px;
      margin: 16px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #cbd5e1;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
      background: #166534;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary { background: #475569; }
    .approve { background: #15803d; }
    .reject { background: #b91c1c; }

    .message {
      padding: 12px;
      border-radius: 8px;
      background: #eff6ff;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .member {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button { flex: 1; }

    .hidden { display: none; }

    small { color: #64748b; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .actions { flex-direction: column; }
    }
  </style>
</head>

<body>
<div class="container">

  <h1>Persetujuan Anggota</h1>
  <p>Bancong Gassminton — Admin</p>

  <section id="loginBox" class="card">
    <h2>Login Admin</h2>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Email admin"
        autocomplete="username"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password admin"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">Masuk</button>
    </form>

    <div id="loginMessage" class="message hidden"></div>
  </section>

  <section id="panel" class="hidden">

    <div class="card">
      <div id="message" class="message">Memeriksa akun admin...</div>

      <button id="refreshButton" type="button">🔄 Muat Ulang</button>
      <button id="dashboardButton" class="secondary" type="button">
        Kembali ke Dashboard
      </button>
      <button id="logoutButton" class="secondary" type="button">
        Keluar
      </button>
    </div>

    <div class="card">
      <h2>📋 Pendaftaran Menunggu</h2>
      <div id="pendingList">Memuat data...</div>
    </div>

    <div class="card">
      <h2>📜 Riwayat Pendaftaran</h2>
      <div id="historyList">Memuat data...</div>
    </div>

  </section>

</div>

<script>
  const SUPABASE_URL = "https://vyrypjxuhiywvkeiewpd.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const loginBox = document.getElementById("loginBox");
  const panel = document.getElementById("panel");
  const loginForm = document.getElementById("loginForm");
  const loginButton = document.getElementById("loginButton");
  const loginMessage = document.getElementById("loginMessage");
  const message = document.getElementById("message");
  const pendingList = document.getElementById("pendingList");
  const historyList = document.getElementById("historyList");

  let busy = false;

  function showMessage(text) {
    message.textContent = text;
    message.classList.remove("hidden");
  }

  function showLoginMessage(text) {
    loginMessage.textContent = text;
    loginMessage.classList.remove("hidden");
  }

  function hideLoginMessage() {
    loginMessage.classList.add("hidden");
  }

  function addText(parent, tag, text) {
    const element = document.createElement(tag);
    element.textContent = text;
    parent.appendChild(element);
    return element;
  }

  function formatDate(value) {
    if (!value) return "-";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return "-";

    return date.toLocaleString("id-ID");
  }

  async function checkAdmin() {
    const { data, error } = await db.auth.getSession();

    if (error || !data.session) {
      loginBox.classList.remove("hidden");
      panel.classList.add("hidden");
      return false;
    }

    const user = data.session.user;
    const role = user.app_metadata?.role;

    if (role !== "admin") {
      await db.auth.signOut();

      loginBox.classList.remove("hidden");
      panel.classList.add("hidden");

      showLoginMessage(
        "Akun ini belum memiliki hak admin. Hubungi pengelola website."
      );

      return false;
    }

    loginBox.classList.add("hidden");
    panel.classList.remove("hidden");

    return true;
  }

  loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    hideLoginMessage();
    loginButton.disabled = true;
    loginButton.textContent = "Sedang masuk...";

    try {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      const isAdmin = await checkAdmin();

      if (isAdmin) {
        await loadRegistrations();
      }
    } catch (error) {
      showLoginMessage("Login gagal: " + error.message);
    } finally {
      loginButton.disabled = false;
      loginButton.textContent = "Masuk";
    }
  });

  function renderEmpty(container, text) {
    container.replaceChildren();
    addText(container, "p", text);
  }

  function renderRegistration(item, isPending) {
    const card = document.createElement("div");
    card.className = "member";

    addText(card, "h3", item.nama || "Nama tidak tersedia");
    addText(card, "p", "WhatsApp: " + (item.nomor_whatsapp || "-"));
    addText(card, "p", "Dusun: " + (item.dusun || "-"));
    addText(card, "p", "Status: " + (item.status || "-"));
    addText(card, "small", "Daftar: " + formatDate(item.created_at));

    if (isPending) {
      const actions = document.createElement("div");
      actions.className = "actions";

      const approveButton = document.createElement("button");
      approveButton.className = "approve";
      approveButton.textContent = "✅ Setujui";

      approveButton.addEventListener("click", function() {
        processRegistration(item, "approved");
      });

      const rejectButton = document.createElement("button");
      rejectButton.className = "reject";
      rejectButton.textContent = "❌ Tolak";

      rejectButton.addEventListener("click", function() {
        processRegistration(item, "rejected");
      });

      actions.append(approveButton, rejectButton);
      card.appendChild(actions);
    }

    return card;
  }

  async function loadRegistrations() {
    if (busy) return;

    showMessage("Sedang memuat data pendaftaran...");

    pendingList.replaceChildren();
    historyList.replaceChildren();

    try {
      const isAdmin = await checkAdmin();

      if (!isAdmin) return;

      const { data, error } = await db
        .from("member_registrations")
        .select("id, nama, nomor_whatsapp, dusun, status, created_at")
        .order("created_at", { ascending: false });

      if (error) throw error;

      const pending = (data || []).filter(
        item => item.status === "pending"
      );

      const history = (data || []).filter(
        item => item.status === "approved" || item.status === "rejected"
      );

      if (pending.length === 0) {
        renderEmpty(pendingList, "Belum ada pendaftaran yang menunggu.");
      } else {
        pending.forEach(item => {
          pendingList.appendChild(renderRegistration(item, true));
        });
      }

      if (history.length === 0) {
        renderEmpty(historyList, "Belum ada riwayat pendaftaran.");
      } else {
        history.forEach(item => {
          historyList.appendChild(renderRegistration(item, false));
        });
      }

      showMessage(
        "Data berhasil dimuat. Menunggu persetujuan: " + pending.length +
        " pendaftaran."
      );

    } catch (error) {
      showMessage(
        "Gagal memuat data: " + error.message +
        ". Periksa izin akses tabel di Supabase."
      );

      renderEmpty(pendingList, "Data tidak dapat dimuat.");
      renderEmpty(historyList, "Data tidak dapat dimuat.");
    }
  }

  async function processRegistration(item, newStatus) {
    if (busy) return;

    const actionText = newStatus === "approved" ? "menyetujui" : "menolak";

    const confirmed = confirm(
      "Yakin ingin " + actionText + " pendaftaran " + item.nama + "?"
    );

    if (!confirmed) return;

    busy = true;
    showMessage("Sedang memproses pendaftaran...");

    try {
      const isAdmin = await checkAdmin();

      if (!isAdmin) return;

      if (newStatus === "approved") {
        const { data: existing, error: checkError } = await db
          .from("members")
          .select("id")
          .eq("nomor_whatsapp", item.nomor_whatsapp)
          .limit(1);

        if (checkError) throw checkError;

        if (!existing || existing.length === 0) {
          const { error: insertError } = await db
            .from("members")
            .insert([{
              nama_anggota: item.nama,
              nomor_whatsapp: item.nomor_whatsapp,
              dusun: item.dusun,
              tanggal_pendaftaran: new Date().toISOString()
            }]);

          if (insertError) throw insertError;
        }
      }

      const { data: updated, error: updateError } = await db
        .from("member_registrations")
        .update({ status: newStatus })
        .eq("id", item.id)
        .eq("status", "pending")
        .select("id");

      if (updateError) throw updateError;

      if (!updated || updated.length === 0) {
        throw new Error(
          "Status tidak berubah. Pendaftaran mungkin sudah diproses atau izin update belum tersedia."
        );
      }

      showMessage(
        newStatus === "approved"
          ? "Pendaftaran berhasil disetujui."
          : "Pendaftaran berhasil ditolak."
      );

      await loadRegistrations();

    } catch (error) {
      showMessage(
        "Gagal memproses: " + error.message +
        ". Jika muncul pesan izin akses, periksa kebijakan RLS Supabase."
      );
    } finally {
      busy = false;
    }
  }

  document.getElementById("refreshButton").addEventListener(
    "click",
    loadRegistrations
  );

  document.getElementById("dashboardButton").addEventListener(
    "click",
    function() {
      window.location.href = "dashboard.html";
    }
  );

  document.getElementById("logoutButton").addEventListener(
    "click",
    async function() {
      await db.auth.signOut();
      panel.classList.add("hidden");
      loginBox.classList.remove("hidden");
      loginForm.reset();
      showLoginMessage("Kamu sudah keluar dari akun admin.");
    }
  );

  async function startPage() {
    const isAdmin = await checkAdmin();

    if (isAdmin) {
      await loadRegistrations();
    }
  }

  startPage();
</script>

</body>
</html>
