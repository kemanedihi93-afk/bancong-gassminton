<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Reset Password | Bancong Gassminton</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #101820;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #1d2935;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 35px #0005;
    }

    h1 {
      text-align: center;
      color: #ff4545;
      font-size: 25px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 16px;
      font-size: 14px;
      color: #e2e8f0;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      background: #101820;
      color: #fff;
      border: 1px solid #465463;
    }

    button {
      background: #e83232;
      color: #fff;
      border: 0;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    a {
      color: #ff7777;
    }

    #message {
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .center {
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>🔐 Password Baru</h1>

    <p class="center">
      Bancong Gassminton
    </p>

    <p>
      Buat kata sandi baru untuk akun kamu. Gunakan minimal
      8 karakter dan jangan bagikan kata sandi kepada siapa pun.
    </p>

    <form id="passwordForm" class="hidden">
      <label for="password">Password baru</label>
      <input
        id="password"
        type="password"
        placeholder="Masukkan password baru"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Ulangi password baru</label>
      <input
        id="confirmPassword"
        type="password"
        placeholder="Masukkan ulang password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button id="saveButton" type="submit">
        Simpan Password Baru
      </button>
    </form>

    <p id="message" role="status" aria-live="polite">
      Memeriksa tautan pemulihan...
    </p>

    <p class="center">
      <a href="anggota-login.html">← Kembali ke Login</a>
    </p>
  </main>

  <script>
    'use strict';

    const SUPABASE_URL =
      'https://vyrypjxuhiywvkeiewpd.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby';

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false
        }
      }
    );

    const form = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const button = document.getElementById('saveButton');
    const message = document.getElementById('message');

    let ready = false;
    let saving = false;

    function showMessage(text, color = '#ff7777') {
      message.style.color = color;
      message.textContent = text;
    }

    function lockForm() {
      ready = false;
      form.classList.add('hidden');
      form.querySelectorAll('input, button').forEach(element => {
        element.disabled = true;
      });
    }

    function unlockForm() {
      ready = true;
      form.classList.remove('hidden');
      form.querySelectorAll('input, button').forEach(element => {
        element.disabled = false;
      });
    }

    function getUrlParameters() {
      const query = new URLSearchParams(location.search);

      const hashText = location.hash.startsWith('#')
        ? location.hash.slice(1)
        : location.hash;

      const hash = new URLSearchParams(hashText);

      return { query, hash };
    }

    async function initialize() {
      lockForm();

      try {
        if (!window.supabase) {
          throw new Error(
            'Pustaka Supabase gagal dimuat. Periksa koneksi internet.'
          );
        }

        const { query, hash } = getUrlParameters();

        const errorDescription =
          hash.get('error_description') ||
          query.get('error_description');

        const urlError =
          hash.get('error') ||
          query.get('error');

        if (urlError || errorDescription) {
          throw new Error(
            errorDescription || urlError
          );
        }

        const code = query.get('code');

        const tokenHash =
          query.get('token_hash') ||
          hash.get('token_hash');

        const type =
          query.get('type') ||
          hash.get('type');

        const accessToken = hash.get('access_token');
        const refreshToken = hash.get('refresh_token');

        if (code) {
          const { error } =
            await db.auth.exchangeCodeForSession(code);

          if (error) {
            throw error;
          }
        } else if (tokenHash && type === 'recovery') {
          const { error } = await db.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'recovery'
          });

          if (error) {
            throw error;
          }
        } else if (accessToken && refreshToken) {
          const { error } = await db.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

          if (error) {
            throw error;
          }
        }

        const { data, error } = await db.auth.getSession();

        if (error) {
          throw error;
        }

        if (!data.session) {
          throw new Error(
            'Sesi pemulihan tidak ditemukan. Gunakan tautan reset password terbaru dari email.'
          );
        }

        // Hapus token dari alamat setelah sesi berhasil dibuat.
        // Sesi tetap tersimpan di Supabase.
        history.replaceState(
          {},
          document.title,
          location.pathname
        );

        unlockForm();

        showMessage(
          'Tautan berhasil diverifikasi. Silakan buat password baru.',
          '#86efac'
        );
      } catch (error) {
        console.error('Pemulihan password gagal:', error);

        lockForm();

        showMessage(
          'Tidak dapat memverifikasi tautan: ' +
          (error.message || 'Kesalahan tidak diketahui') +
          '. Minta tautan pemulihan baru jika tautan sudah kedaluwarsa.'
        );
      }
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      if (!ready || saving) {
        return;
      }

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (password.length < 8) {
        showMessage('Password harus minimal 8 karakter.');
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Kedua password tidak sama.');
        return;
      }

      saving = true;
      button.disabled = true;
      button.textContent = 'Menyimpan password...';

      try {
        const { data: sessionData, error: sessionError } =
          await db.auth.getSession();

        if (sessionError) {
          throw sessionError;
        }

        if (!sessionData.session) {
          throw new Error(
            'Sesi pemulihan sudah tidak aktif. Gunakan tautan terbaru dari email.'
          );
        }

        const { error } = await db.auth.updateUser({
          password: password
        });

        if (error) {
          throw error;
        }

        // Password berhasil diubah.
        lockForm();
        form.reset();

        showMessage(
          'Password berhasil diperbarui. Silakan masuk dengan password baru.',
          '#86efac'
        );

        // Tutup sesi pemulihan.
        const { error: signOutError } =
          await db.auth.signOut();

        if (signOutError) {
          console.error('Sign out gagal:', signOutError);
        }

        setTimeout(function() {
          location.href = 'anggota-login.html';
        }, 2500);

      } catch (error) {
        console.error('Gagal menyimpan password:', error);

        showMessage(
          'Gagal memperbarui password: ' +
          (error.message || 'Kesalahan tidak diketahui')
        );

      } finally {
        saving = false;

        if (ready) {
          button.disabled = false;
          button.textContent = 'Simpan Password Baru';
        }
      }
    });

    initialize();
  </script>
</body>
</html>
