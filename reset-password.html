<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buat Password Baru | Bancong Gassminton</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #1d2935;
      padding: 25px;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
      color: #ff4545;
      font-size: 24px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.5;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      background: #101820;
      color: white;
      border: 1px solid #465463;
    }

    button {
      background: #e83232;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    a {
      color: #ff7777;
    }

    #message {
      overflow-wrap: anywhere;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>🔐 Password Baru</h1>

    <p>
      Buat kata sandi baru untuk akun anggota GASSMINTON.
    </p>

    <form id="passwordForm">
      <input
        id="password"
        type="password"
        placeholder="Password baru (minimal 8 karakter)"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <input
        id="confirmPassword"
        type="password"
        placeholder="Ulangi password baru"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button id="saveButton" type="submit">
        Simpan Password Baru
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p>
      <a href="anggota-login.html">← Kembali ke Login</a>
    </p>
  </main>

  <script>
    const SUPABASE_URL =
      'https://vyrypjxuhiywvkeiewpd.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby';

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById('passwordForm');
    const button = document.getElementById('saveButton');
    const message = document.getElementById('message');

    let ready = false;

    function showMessage(text, color = '#ff7777') {
      message.style.color = color;
      message.textContent = text;
    }

    async function initialize() {
      try {
        const params = new URLSearchParams(location.search);
        const code = params.get('code');

        if (code) {
          const { error } =
            await db.auth.exchangeCodeForSession(code);

          if (error) {
            throw error;
          }

          history.replaceState(
            {},
            document.title,
            location.pathname
          );
        }

        const { data, error } = await db.auth.getSession();

        if (error) {
          throw error;
        }

        if (!data.session) {
          showMessage(
            'Sesi pemulihan tidak ditemukan atau tautan sudah kedaluwarsa. Silakan gunakan tautan pemulihan yang valid.'
          );

          form.querySelectorAll('input, button').forEach(el => {
            el.disabled = true;
          });

          return;
        }

        ready = true;

        showMessage(
          'Sesi pemulihan berhasil diperiksa. Silakan buat password baru.',
          '#86efac'
        );

      } catch (error) {
        console.error(
          'Gagal membuka sesi pemulihan:',
          error
        );

        showMessage(
          'Gagal membuka sesi pemulihan: ' +
          (error.message || 'Kesalahan tidak diketahui.')
        );

        form.querySelectorAll('input, button').forEach(el => {
          el.disabled = true;
        });
      }
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      if (!ready) {
        showMessage(
          'Sesi pemulihan belum siap. Buka tautan pemulihan dari email terlebih dahulu.'
        );
        return;
      }

      if (button.disabled) {
        return;
      }

      const password =
        document.getElementById('password').value;

      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showMessage(
          'Password harus terdiri dari minimal 8 karakter.'
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage('Kedua password tidak sama.');
        return;
      }

      button.disabled = true;
      button.textContent = 'Memeriksa sesi...';

      try {
        // Pastikan sesi pemulihan masih aktif.
        const {
          data: sessionData,
          error: sessionError
        } = await db.auth.getSession();

        if (sessionError) {
          throw sessionError;
        }

        if (!sessionData.session) {
          throw new Error(
            'Sesi pemulihan tidak ditemukan. Buka tautan pemulihan dari email.'
          );
        }

        // Perbarui password akun yang memiliki sesi aktif.
        button.textContent = 'Menyimpan password...';

        const { data, error } = await db.auth.updateUser({
          password: password
        });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error(
            'Supabase tidak mengembalikan informasi akun setelah pembaruan.'
          );
        }

        showMessage(
          'Password berhasil diperbarui untuk akun ' +
          data.user.email +
          '.',
          '#86efac'
        );

        // Akhiri sesi setelah password berhasil diperbarui.
        const { error: signOutError } =
          await db.auth.signOut();

        if (signOutError) {
          console.error(
            'Sign out gagal:',
            signOutError
          );

          showMessage(
            'Password berhasil diperbarui untuk akun ' +
            data.user.email +
            '. Silakan buka halaman login.',
            '#86efac'
          );

          return;
        }

        form.reset();

        showMessage(
          'Password berhasil diperbarui. Mengalihkan ke halaman login...',
          '#86efac'
        );

        setTimeout(() => {
          location.href = 'anggota-login.html';
        }, 3000);

      } catch (error) {
        console.error(
          'Detail kesalahan Supabase:',
          error
        );

        showMessage(
          'Gagal memperbarui password: ' +
          (error.message || 'Kesalahan tidak diketahui.') +
          ' Silakan periksa sesi pemulihan.'
        );

      } finally {
        button.disabled = false;
        button.textContent = 'Simpan Password Baru';
      }
    });

    initialize();
  </script>
</body>
</html>
