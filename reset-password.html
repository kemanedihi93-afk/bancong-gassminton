<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat Password Baru | Bancong Gassminton</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;background:#101820;
  color:white;font-family:Arial,sans-serif
}
.card{
  width:100%;max-width:400px;background:#1d2935;
  padding:25px;border-radius:16px
}
h1{text-align:center;color:#ff4545;font-size:24px}
p{color:#cbd5e1;line-height:1.5}
input,button{
  width:100%;padding:13px;margin-top:12px;
  border-radius:8px;font-size:16px
}
input{background:#101820;color:white;border:1px solid #465463}
button{
  background:#e83232;color:white;border:0;
  font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
a{color:#ff7777}
#message{overflow-wrap:anywhere;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Password Baru</h1>
  <p>Buat kata sandi baru untuk akun anggota GASSMINTON.</p>

  <form id="passwordForm">
    <input id="password" type="password"
      placeholder="Password baru (minimal 8 karakter)"
      autocomplete="new-password" minlength="8" required>

    <input id="confirmPassword" type="password"
      placeholder="Ulangi password baru"
      autocomplete="new-password" minlength="8" required>

    <button id="saveButton" type="submit">Simpan Password Baru</button>
  </form>

  <p id="message" role="status"></p>
  <p><a href="anggota-login.html">← Kembali ke Login</a></p>
</div>

<script>
const URL='https://vyrypjxuhiywvkeiewpd.supabase.co';
const KEY='sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby';
const db=window.supabase.createClient(URL,KEY);

const form=document.getElementById('passwordForm');
const button=document.getElementById('saveButton');
const message=document.getElementById('message');

let ready=false;

function showMessage(text,color='#ff7777'){
  message.style.color=color;
  message.textContent=text;
}

async function initialize(){
  try{
    const params=new URLSearchParams(location.search);
    const code=params.get('code');

    if(code){
      const {error}=await db.auth.exchangeCodeForSession(code);
      if(error) throw error;
      history.replaceState({},document.title,location.pathname);
    }

    const {data,error}=await db.auth.getSession();

    if(error || !data.session){
      showMessage(
        'Sesi pemulihan tidak ditemukan atau tautan sudah kedaluwarsa. Minta tautan pemulihan yang baru.'
      );
      form.querySelectorAll('input,button').forEach(el=>el.disabled=true);
      return;
    }

    ready=true;
    showMessage('Silakan buat password baru.', '#86efac');
  }catch(error){
    console.error('Gagal membuka sesi pemulihan:',error);
    showMessage(
      'Tautan tidak valid atau sudah kedaluwarsa. Silakan minta tautan pemulihan baru.'
    );
    form.querySelectorAll('input,button').forEach(el=>el.disabled=true);
  }
}

form.addEventListener('submit',async function(e){
  e.preventDefault();

  if(!ready){
    showMessage('Sesi pemulihan belum siap. Buka tautan dari email terlebih dahulu.');
    return;
  }

  const password=document.getElementById('password').value;
  const confirmPassword=document.getElementById('confirmPassword').value;

  if(password.length<8){
    showMessage('Password harus terdiri dari minimal 8 karakter.');
    return;
  }

  if(password!==confirmPassword){
    showMessage('Kedua password tidak sama.');
    return;
  }

  button.disabled=true;
  button.textContent='Menyimpan...';

  try{
    const {error}=await db.auth.updateUser({password});

    if(error) throw error;

    showMessage(
      'Password berhasil diperbarui! Silakan login menggunakan password baru.',
      '#86efac'
    );

    await db.auth.signOut();
    form.reset();

    setTimeout(()=>{
      location.href='anggota-login.html';
    },2500);
  }catch(error){
    console.error('Gagal memperbarui password:',error);
    showMessage('Password belum berhasil diubah. Coba buka tautan pemulihan terbaru.');
  }finally{
    button.disabled=false;
    button.textContent='Simpan Password Baru';
  }
});

initialize();
</script>
</body>
</html>
