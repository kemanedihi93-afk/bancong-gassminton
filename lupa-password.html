<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lupa Password | Bancong Gassminton</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;background:#101820;
  color:white;font-family:Arial,sans-serif
}
.card{
  width:100%;max-width:400px;background:#1d2935;
  padding:25px;border-radius:16px
}
h1{text-align:center;color:#ff4545;font-size:24px}
p{color:#cbd5e1;line-height:1.5}
input,button{
  width:100%;padding:13px;margin-top:12px;
  border-radius:8px;font-size:16px
}
input{background:#101820;color:white;border:1px solid #465463}
button{
  background:#e83232;color:white;border:0;
  font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
a{color:#ff7777}
#message{overflow-wrap:anywhere;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Lupa Password</h1>
  <p>Masukkan email yang kamu gunakan untuk login anggota GASSMINTON.</p>

  <form id="resetForm">
    <input id="email" type="email" placeholder="Alamat email"
      autocomplete="email" required>
    <button id="sendButton" type="submit">Kirim Tautan Pemulihan</button>
  </form>

  <p id="message" role="status"></p>
  <p><a href="anggota-login.html">← Kembali ke Login</a></p>
</div>

<script>
const URL='https://vyrypjxuhiywvkeiewpd.supabase.co';
const KEY='sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby';
const db=window.supabase.createClient(URL,KEY);

const form=document.getElementById('resetForm');
const button=document.getElementById('sendButton');
const message=document.getElementById('message');

form.addEventListener('submit',async function(e){
  e.preventDefault();
  button.disabled=true;
  button.textContent='Mengirim...';
  message.textContent='';

  try{
    const email=document.getElementById('email').value.trim();

    const {error}=await db.auth.resetPasswordForEmail(email,{
      redirectTo:location.origin+'/reset-password.html'
    });

    if(error) throw error;

    message.style.color='#86efac';
    message.textContent=
      'Jika email tersebut terdaftar, tautan pemulihan akan dikirim. Periksa kotak masuk dan folder Spam.';
  }catch(error){
    console.error('Pemulihan password gagal:',error);
    message.style.color='#ff7777';
    message.textContent=
      'Tautan belum dapat dikirim. Periksa koneksi atau pengaturan email Supabase.';
  }finally{
    button.disabled=false;
    button.textContent='Kirim Tautan Pemulihan';
  }
});
</script>
</body>
</html>
