<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANCONG GASSMINTON</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101010;
      color: #ffffff;
    }

    header {
      text-align: center;
      padding: 35px 15px;
      background: linear-gradient(135deg, #d71920, #111111);
      border-bottom: 4px solid #ffffff;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
    }

    header p {
      margin-bottom: 0;
      letter-spacing: 3px;
      font-weight: bold;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 20px 15px;
    }

    .section {
      background: #1d1d1d;
      border: 1px solid #383838;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 22px;
    }

    h2 {
      color: #ff3838;
      margin-top: 0;
      border-bottom: 1px solid #444;
      padding-bottom: 12px;
    }

    .card {
      background: #292929;
      border-left: 4px solid #ed2525;
      border-radius: 8px;
      padding: 15px;
      margin: 12px 0;
    }

    .card h3 {
      margin: 0 0 12px;
      color: #ffffff;
    }

    .card p {
      margin: 7px 0;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .muted {
      color: #cccccc;
      line-height: 1.6;
    }

    .error {
      color: #ff7777;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #aaaaaa;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🏸 BANCONG GASSMINTON</h1>
    <p>DATAR BANCONG</p>
    <p>BERSATU • BERGERAK • BERPRESTASI</p>
  </header>

  <main>
    <section class="section">
      <h2>📅 Jadwal Badminton</h2>
      <div id="schedules" class="muted">
        Sedang mengambil jadwal dari database...
      </div>
    </section>

    <section class="section">
      <h2>🏆 Turnamen</h2>
      <div id="tournaments" class="muted">
        Sedang mengambil informasi turnamen...
      </div>
    </section>
  </main>

  <footer>
    BANCONG GASSMINTON — DATAR BANCONG
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://vyrypjxuhiywvkeiewpd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_pRU3ZWYBomp_vQoUaI6Tzg_TbxqrYby";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function aman(nilai) {
      const elemen = document.createElement("span");
      elemen.textContent =
        nilai === null || nilai === undefined || nilai === ""
          ? "-"
          : String(nilai);

      return elemen.textContent;
    }

    function formatTanggal(tanggal) {
      if (!tanggal) return "-";

      const hasil = new Date(tanggal + "T00:00:00");

      if (Number.isNaN(hasil.getTime())) {
        return aman(tanggal);
      }

      return hasil.toLocaleDateString("id-ID", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
    }

    function buatKartu(judul, rincian) {
      const kartu = document.createElement("div");
      kartu.className = "card";

      const heading = document.createElement("h3");
      heading.textContent = judul || "Informasi kegiatan";
      kartu.appendChild(heading);

      rincian.forEach(([label, nilai]) => {
        if (nilai === null || nilai === undefined || nilai === "") {
          return;
        }

        const baris = document.createElement("p");
        baris.textContent = label + ": " + aman(nilai);
        kartu.appendChild(baris);
      });

      return kartu;
    }

    async function muatJadwal() {
      const tempat = document.getElementById("schedules");
      tempat.textContent = "Sedang memuat jadwal...";

      try {
        const { data, error } = await client
          .from("schedules")
          .select("id,judul,tanggal,waktu,lokasi,keterangan")
          .order("tanggal", { ascending: true })
          .limit(50);

        if (error) throw error;

        tempat.replaceChildren();

        if (!data || data.length === 0) {
          tempat.textContent = "Belum ada jadwal yang tersedia.";
          return;
        }

        data.forEach(item => {
          const waktu = item.waktu
            ? String(item.waktu).slice(0, 5)
            : "";

          tempat.appendChild(
            buatKartu(item.judul, [
              ["Tanggal", formatTanggal(item.tanggal)],
              ["Waktu", waktu],
              ["Lokasi", item.lokasi],
              ["Keterangan", item.keterangan]
            ])
          );
        });
      } catch (error) {
        console.error("Gagal memuat jadwal:", error);
        tempat.replaceChildren();

        const pesan = document.createElement("p");
        pesan.className = "error";
        pesan.textContent =
          "Jadwal gagal dimuat. Periksa koneksi dan pengaturan akses tabel schedules di Supabase.";

        tempat.appendChild(pesan);
      }
    }

    async function muatTurnamen() {
      const tempat = document.getElementById("tournaments");
      tempat.textContent = "Sedang memuat turnamen...";

      try {
        const { data, error } = await client
          .from("tournaments")
          .select("*")
          .limit(50);

        if (error) throw error;

        tempat.replaceChildren();

        if (!data || data.length === 0) {
          tempat.textContent = "Belum ada informasi turnamen.";
          return;
        }

        data.forEach(item => {
          const judul =
            item.nama_turnamen ||
            item.judul ||
            item.nama ||
            "Turnamen Badminton";

          tempat.appendChild(
            buatKartu(judul, [
              ["Tanggal mulai", formatTanggal(item.tanggal_mulai)],
              ["Tanggal selesai", formatTanggal(item.tanggal_selesai)],
              ["Lokasi", item.lokasi],
              ["Status", item.status],
              ["Keterangan", item.keterangan]
            ])
          );
        });
      } catch (error) {
        console.error("Gagal memuat turnamen:", error);
        tempat.replaceChildren();

        const pesan = document.createElement("p");
        pesan.className = "error";
        pesan.textContent =
          "Informasi turnamen belum dapat dimuat. Periksa pengaturan akses tabel tournaments di Supabase.";

        tempat.appendChild(pesan);
      }
    }

    muatJadwal();
    muatTurnamen();
  </script>
</body>
</html>
